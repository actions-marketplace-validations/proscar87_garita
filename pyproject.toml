[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garita"
version = "0.34.0"
description = "Impide que datos personales y credenciales entren a un repositorio git"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Oscar Pacheco", email = "proscar87@users.noreply.github.com" }]
requires-python = ">=3.9"
keywords = ["pii", "curp", "rfc", "clabe", "secret-scanning", "dlp",
            "pre-commit", "github-action", "lfpdppp", "mexico"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Natural Language :: Spanish",
  # Hay un README completo en inglés (README.en.md); sin este clasificador
  # PyPI anuncia la herramienta como monolingüe y la filtra de las
  # búsquedas en inglés, que es justo donde no nos encuentran.
  "Natural Language :: English",
]
# Sin dependencias, a propósito: un guardián que exige `pip install` antes de
# correr es un guardián que la gente pospone, y el que se pospone no protege.
dependencies = []

[project.scripts]
garita = "garita.cli:main"

# Los nombres van en inglés a propósito, aunque el resto del proyecto no:
# PyPI sólo dibuja el icono de la barra lateral cuando reconoce la etiqueta.
# «Repositorio» salía como enlace pelado y sin icono.
[project.urls]
Homepage = "https://github.com/proscar87/garita"
Documentation = "https://github.com/proscar87/garita/blob/main/README.en.md"
Repository = "https://github.com/proscar87/garita"
Issues = "https://github.com/proscar87/garita/issues"
Changelog = "https://github.com/proscar87/garita/releases"

[tool.setuptools.packages.find]
where = ["src"]
